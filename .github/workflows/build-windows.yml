# 윈도우용 실행 파일(.exe) 만들기
# 자동으로 돌지 않고, GitHub의 Actions 화면에서 'Run workflow'를 눌렀을 때만 실행됩니다.
name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.22.3

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q
          python -c "import app.ui_qt; print('ui import ok')"
          python tests/windows_ocr_check.py

      - name: Set version
        shell: bash
        run: echo 'VERSION = "${{ github.run_number }}"' > app/version.py

      # 폴더 방식 (설치용·자동 업데이트용): 켤 때 풀어 놓는 과정이 없어서 빨리 켜짐
      - name: Build app folder
        run: >
          pyinstaller --noconfirm --onedir --windowed --name ManosTranslator
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime
          --icon assets/icon.ico --add-data "assets/icon.ico;assets" --exclude-module tkinter
          run.py

      - name: Zip app folder
        shell: pwsh
        run: Compress-Archive -Path dist\ManosTranslator\* -DestinationPath dist\ManosTranslator.zip -Force

      # 예전 버전(한 덩어리 파일)이 새 버전으로 넘어올 수 있게 한동안 같이 올림
      - name: Build single exe (for old versions)
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ManosTranslator
          --distpath dist_onefile --workpath build_onefile
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime
          --icon assets/icon.ico --add-data "assets/icon.ico;assets" --exclude-module tkinter
          run.py

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.run_number }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ManosTranslator.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ManosTranslator-windows
          path: |
            dist/ManosTranslator.zip
            dist/ManosTranslator-Setup.exe
          retention-days: 14

      # 자동 업데이트용: 새 버전(v빌드번호)으로 실행 파일을 올림
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git log -1 --format=%B > notes.txt
          gh release create "v${{ github.run_number }}" dist/ManosTranslator.zip dist_onefile/ManosTranslator.exe \
            dist/ManosTranslator-Setup.exe \
            --target "${{ github.sha }}" --title "발주 번역기 v${{ github.run_number }}" --notes-file notes.txt
