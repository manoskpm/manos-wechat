# 윈도우용 실행 파일(.exe) 만들기
# 자동으로 돌지 않고, GitHub의 Actions 화면에서 'Run workflow'를 눌렀을 때만 실행됩니다.
name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.22.3

      - name: Test
        run: |
          python -m pytest -q
          python -c "import app.ui; print('ui import ok')"
          python -c "import winrt.windows.media.ocr; print('winrt ok')"
          python -c "from PIL import Image; from app.korean_ocr import read_text; print('korean ocr:', read_text(Image.new('RGB', (200, 40), 'white')))"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ManosTranslator
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime --collect-all winrt
          run.py

      - uses: actions/upload-artifact@v4
        with:
          name: ManosTranslator-windows
          path: dist/ManosTranslator.exe
          retention-days: 14
