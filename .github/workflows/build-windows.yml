# 윈도우용 실행 파일(.exe) 만들기
# 자동으로 돌지 않고, GitHub의 Actions 화면에서 'Run workflow'를 눌렀을 때만 실행됩니다.
name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.22.3

      - name: Test
        run: |
          python -m pytest -q
          python -c "import app.ui; print('ui import ok')"
          python tests/windows_ocr_check.py

      - name: Set version
        shell: bash
        run: echo 'VERSION = "${{ github.run_number }}"' > app/version.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ManosTranslator
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime
          run.py

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.run_number }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\ManosTranslator.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ManosTranslator-windows
          path: |
            dist/ManosTranslator.exe
            dist/ManosTranslator-Setup.exe
          retention-days: 14

      # 자동 업데이트용: 새 버전(v빌드번호)으로 실행 파일을 올림
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git log -1 --format=%B > notes.txt
          gh release create "v${{ github.run_number }}" dist/ManosTranslator.exe dist/ManosTranslator-Setup.exe \
            --target "${{ github.sha }}" --title "발주 번역기 v${{ github.run_number }}" --notes-file notes.txt
