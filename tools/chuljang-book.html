<title>중국 출장북</title>
<style>
:root {
  --bg: #ededed; --card: #ffffff; --text: #191919; --sub: #7a7a7a; --line: #e5e5e5;

}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111111; --card: #1e1e1e; --text: #e8e8e8; --sub: #9a9a9a; --line: #2c2c2c;
          --greenbg: #12301f; --zh: #ffffff; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; }
h1 { font-size: 20px; margin: 0 0 8px; }
h1 small { font-size: 12px; color: var(--sub); font-weight: normal; margin-left: 6px; }
#q { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
     background: var(--card); color: var(--text); }
nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 16px; padding: 6px 12px; font-size: 14px; }
nav button.on { background: var(--green); border-color: var(--green); color: #fff; }
main { padding: 4px 16px 40px; max-width: 720px; margin: 0 auto; }
.sec { font-size: 13px; color: var(--sub); margin: 18px 4px 6px; }
.item { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex;
  gap: 10px; align-items: flex-start; border: 1px solid var(--line); }
.item .body { flex: 1; min-width: 0; cursor: pointer; }
.ko { font-size: 14px; color: var(--sub); }
.zh { font-size: 22px; color: var(--zh); margin: 4px 0 2px; word-break: keep-all; }
.read { font-size: 13px; color: var(--green); }
.py { font-size: 12px; color: var(--sub); margin-left: 6px; }
.star { border: none; background: none; font-size: 22px; color: var(--line); padding: 0 2px; }
.star.on { color: var(--star); }
.empty { color: var(--sub); text-align: center; padding: 40px 0; }
.box { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--line); margin-bottom: 10px; }
.box label { font-size: 13px; color: var(--sub); display: block; margin-bottom: 6px; }
.box input, .box textarea { width: 100%; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; }
.box .row { display: flex; gap: 8px; margin-top: 8px; }
.btn { border: none; background: var(--green); color: #fff; border-radius: 8px; padding: 9px 14px; font-size: 15px; }
.btn.gray { background: var(--line); color: var(--text); }
.num-out { font-size: 30px; color: var(--zh); margin-top: 10px; word-break: break-all; }
.num-read { font-size: 15px; color: var(--green); margin-top: 2px; }
#big { position: fixed; inset: 0; background: var(--card); z-index: 20; display: none; flex-direction: column;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
#big.show { display: flex; }
#big .zh { font-size: clamp(34px, 11vw, 72px); line-height: 1.25; flex: 1; display: flex; align-items: center;
  justify-content: center; text-align: center; white-space: pre-line; }
#big .ko { text-align: center; font-size: 16px; }
#big .read { text-align: center; font-size: 16px; margin-top: 4px; }
#big .row { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(0,0,0,.8);
  color: #fff; padding: 8px 14px; border-radius: 16px; font-size: 14px; display: none; z-index: 30; }
.tip { font-size: 13px; color: var(--sub); line-height: 1.5; }
.sos { color: var(--warn); font-weight: bold; }
</style>

const DIGIT = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const DIGIT_KO = ["링", "이", "얼", "싼", "쓰", "우", "류", "치", "빠", "지우"];
const UNIT = ["", "十", "百", "千"], UNIT_KO = ["", "스", "바이", "첸"];

// 숫자 → 중국어 (예: 3500 → 三千五百, 1.5 → 一点五)
function toChinese(n) {
  if (!/^\d{1,8}(\.\d{1,2})?$/.test(n)) return null;
  let [ip, fp] = n.split(".");
  if (fp) fp = fp.replace(/0+$/, "");   // 170.00 → 170
  let zh = [], ko = [];
  const part = (s) => {   // 0~9999
    let z = "", k = [], zero = false;
    const d = s.padStart(4, "0").split("").map(Number);
    d.forEach((v, i) => {
      const u = 3 - i;
      if (v === 0) { zero = z.length > 0; return; }
      if (zero) { z += "零"; k.push("링"); zero = false; }
      const two = v === 2 && u >= 2;   // 200·2000 은 两百·两千 이 자연스러움
      z += (two ? "两" : DIGIT[v]) + UNIT[u];
      k.push((two ? "량" : DIGIT_KO[v]) + UNIT_KO[u]);
    });
    return [z, k.join(" ")];
  };
  const num = parseInt(ip, 10);
  if (num === 0) { zh = ["零"]; ko = ["링"]; }
  else {
    const wan = Math.floor(num / 10000), rest = num % 10000;
    if (wan) {
      let [z, k] = part(String(wan));
      if (wan === 2) { z = "两"; k = "량"; }   // 2만 = 两万
      zh.push(z + "万"); ko.push(k + "완");
    }
    if (rest) {
      const [z, k] = part(String(rest));
      zh.push((wan && rest < 1000 ? "零" : "") + z);
      ko.push((wan && rest < 1000 ? "링 " : "") + k);
    }
  }
  let z = zh.join(""), k = ko.join(" ");
  if (z.startsWith("一十")) { z = z.slice(1); k = k.replace(/^이스/, "스"); }   // 10~19 는 十로 시작
  if (fp) { z += "点" + fp.split("").map(c => DIGIT[+c]).join(""); k += " 뎬 " + fp.split("").map(c => DIGIT_KO[+c]).join(" "); }
  return [z, k];
}

};
let favs = store.get("cj_favs", []);
let tab = store.get("cj_tab", "★ 즐겨찾기");
const TABS = ["★ 즐겨찾기", "📍 내 주소", "🔢 숫자", ...Object.keys(DATA)];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 1500);
}
function copy(text) {
  const done = () => toast("복사됨");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
  function fallback() {
    const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a);
    a.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("복사 실패"); } a.remove();
  }
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("이 기기는 소리 기능이 없어요"); return; }
  const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
let bigText = "";
function showBig(ko, zh, read) {
  bigText = zh; $("#bigKo").textContent = ko; $("#bigZh").textContent = zh; $("#bigRead").textContent = read || "";
  $("#big").classList.add("show");
}
$("#bigClose").onclick = () => $("#big").classList.remove("show");
$("#bigCopy").onclick = () => copy(bigText);
$("#bigSpeak").onclick = () => speak(bigText);

function itemEl(p) {
  const [ko, zh, py, read] = p;
  const el = document.createElement("div"); el.className = "item";
  const body = document.createElement("div"); body.className = "body";
  body.innerHTML = `<div class="ko"></div><div class="zh"></div><div><span class="read"></span><span class="py"></span></div>`;
  body.querySelector(".ko").textContent = ko;
  body.querySelector(".zh").textContent = zh;
  body.querySelector(".read").textContent = read;
  body.querySelector(".py").textContent = py;
  body.onclick = () => showBig(ko, zh, read);
  const st = document.createElement("button"); st.className = "star" + (favs.includes(zh) ? " on" : "");
  st.textContent = "★"; st.title = "즐겨찾기";
  st.onclick = () => {
    favs = favs.includes(zh) ? favs.filter(x => x !== zh) : [...favs, zh];
    store.set("cj_favs", favs); render();
  };
  el.append(body, st);
  return el;
}

function renderTabs() {
  const nav = $("#tabs"); nav.innerHTML = "";
  TABS.forEach(t => {
    const b = document.createElement("button"); b.textContent = t; b.className = t === tab ? "on" : "";
    b.onclick = () => { tab = t; store.set("cj_tab", t); $("#q").value = ""; render(); };
    nav.append(b);
  });
}

function render() {
  renderTabs();
  const list = $("#list"); list.innerHTML = "";
  const q = $("#q").value.trim().toLowerCase();
  const all = Object.entries(DATA).flatMap(([c, arr]) => arr.map(p => [c, p]));
  if (q) {
    const hit = all.filter(([c, p]) => (c + p.join(" ")).toLowerCase().includes(q));
    if (!hit.length) list.innerHTML = `<div class="empty">찾는 문장이 없어요</div>`;
    hit.forEach(([c, p]) => list.append(itemEl(p)));
    return;
  }
  if (tab === "★ 즐겨찾기") {
    const f = all.filter(([c, p]) => favs.includes(p[1]));
    if (!f.length) list.innerHTML = `<div class="empty">문장 옆 ★ 을 누르면 여기에 모여요<br><br>
      <span class="tip">문장을 누르면 크게 보여서 상대방에게 화면을 보여 줄 수 있어요.<br>
      인터넷이 없어도 됩니다. 이 파일만 휴대폰에 있으면 돼요.</span></div>`;
    f.forEach(([c, p]) => list.append(itemEl(p)));
    return;
  }
  if (tab === "📍 내 주소") { renderAddr(list); return; }
  if (tab === "🔢 숫자") { renderNum(list); return; }
  (DATA[tab] || []).forEach(p => list.append(itemEl(p)));
  if (tab === "긴급") {
    const b = document.createElement("div"); b.className = "box tip";
    b.innerHTML = `<span class="sos">중국 긴급 번호</span> 경찰 110 · 구급차 120 · 화재 119`;
    list.append(b);
  }
}

function renderAddr(list) {
  const addrs = store.get("cj_addr", [{ name: "호텔", zh: "" }, { name: "업체", zh: "" }, { name: "물류 회사", zh: "" }]);
  const tip = document.createElement("div"); tip.className = "tip"; tip.style.margin = "6px 4px 12px";
  tip.textContent = "출발 전에 호텔·업체 주소를 중국어로 붙여 넣어 두세요. (업체에 위챗으로 받아 복사) " +
    "택시 기사님께 [크게 보기]를 보여 주면 됩니다. 이 휴대폰에만 저장돼요.";
  list.append(tip);
  addrs.forEach((a, i) => {
    const box = document.createElement("div"); box.className = "box";
    box.innerHTML = `<label></label><input class="nm" placeholder="이름 (예: 호텔)"><textarea rows="2" class="ad" style="margin-top:6px" placeholder="중국어 주소 붙여 넣기"></textarea>
      <div class="row"><button class="btn big">크게 보기</button><button class="btn gray cp">복사</button><button class="btn gray del">지우기</button></div>`;
    box.querySelector("label").textContent = "주소 " + (i + 1);
    box.querySelector(".nm").value = a.name; box.querySelector(".ad").value = a.zh;
    const save = () => { addrs[i] = { name: box.querySelector(".nm").value, zh: box.querySelector(".ad").value }; store.set("cj_addr", addrs); };
    box.querySelector(".nm").oninput = save; box.querySelector(".ad").oninput = save;
    box.querySelector(".big").onclick = () => {
      const zh = box.querySelector(".ad").value.trim();
      if (!zh) { toast("주소를 먼저 넣어 주세요"); return; }
      showBig((a.name || "주소") + " — 이 주소로 가 주세요", "请带我去这个地址：\n" + zh, "칭 따이 워 취 저거 디즈");
    };
    box.querySelector(".cp").onclick = () => copy(box.querySelector(".ad").value);
    box.querySelector(".del").onclick = () => { addrs.splice(i, 1); store.set("cj_addr", addrs); render(); };
    list.append(box);
  });
  const add = document.createElement("button"); add.className = "btn"; add.textContent = "+ 주소 추가";
  add.onclick = () => { addrs.push({ name: "", zh: "" }); store.set("cj_addr", addrs); render(); };
  list.append(add);
}

function renderNum(list) {
  const box = document.createElement("div"); box.className = "box";
  box.innerHTML = `<label>숫자를 넣으면 중국어로 (가격·수량 말할 때)</label>
    <input id="numIn" inputmode="decimal" placeholder="예: 3500">
    <div class="num-out" id="numZh"></div><div class="num-read" id="numKo"></div>
    <div class="row"><button class="btn" id="numBig">크게 보기</button><button class="btn gray" id="numSpeak">🔊 소리</button></div>`;
  list.append(box);
  const upd = () => {
    const v = $("#numIn").value.replace(/,/g, "").trim();
    const r = v ? toChinese(v) : null;
    $("#numZh").textContent = r ? r[0] : (v ? "숫자만 넣어 주세요 (1억 미만)" : "");
    $("#numKo").textContent = r ? r[1] : "";
  };
  $("#numIn").oninput = upd;
  $("#numBig").onclick = () => { const v = $("#numIn").value.replace(/,/g, ""); const r = toChinese(v);
    if (r) showBig(v, r[0] + "\n" + v, r[1]); };
  $("#numSpeak").onclick = () => { const r = toChinese($("#numIn").value.replace(/,/g, "")); if (r) speak(r[0]); };
  const units = [
    ["개", "个", "ge", "거"], ["박스", "箱", "xiāng", "샹"], ["위안", "元 / 块", "yuán / kuài", "위안 / 콰이"],
    ["킬로그램", "公斤", "gōngjīn", "궁진"], ["만", "万", "wàn", "완"], ["천", "千", "qiān", "첸"],
    ["백", "百", "bǎi", "바이"], ["반", "半", "bàn", "반"],
  ];
  const sec = document.createElement("div"); sec.className = "sec"; sec.textContent = "자주 쓰는 단위"; list.append(sec);
  units.forEach(p => list.append(itemEl(p)));
  const tip = document.createElement("div"); tip.className = "box tip";
  tip.textContent = "시장에서는 元(위안) 대신 块(콰이)라고 많이 말해요. 예: 三十块 = 30위안.";
  list.append(tip);
}

$("#q").oninput = render;
render();
</script>
</body>
</html>
