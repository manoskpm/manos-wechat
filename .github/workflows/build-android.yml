# 안드로이드 앱(APK) 만들기
# 자동으로 돌지 않고, GitHub의 Actions 화면에서 'Run workflow'를 눌렀을 때만 실행됩니다.
# 윈도우 번역기의 자동 업데이트(releases/latest)와 섞이지 않게 '시험판(prerelease)'으로만 올립니다.
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -Pvcode=${{ github.run_number }} -Pvname=${{ github.run_number }}

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ManosTranslator-Android.apk
          gh release create "android-${{ github.run_number }}" ManosTranslator-Android.apk \
            --prerelease --latest=false --target "${{ github.sha }}" \
            --title "발주 번역기 안드로이드 ${{ github.run_number }}" \
            --notes "안드로이드 휴대폰용 앱 파일입니다. 휴대폰에서 내려받아 설치하세요."
